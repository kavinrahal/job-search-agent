# job_criteria.yaml
# Source of truth for all evaluation and application skills.
# Update this document — do not hardcode criteria in individual skills.
version: "1.0"

# ---------------------------------------------------------------------------
# HARD DISQUALIFIERS
# Any one of these ends evaluation immediately — do not present to candidate.
# ---------------------------------------------------------------------------
hard_disqualifiers:

  - id: sponsorship_excluded
    description: Explicitly excludes candidates requiring visa sponsorship
    signals:
      - "no visa sponsorship"
      - "must be an Australian citizen or permanent resident"
      - "Australian citizenship or permanent residency required"
      - "unrestricted work rights required"
      - "must have full working rights"
      - "open to citizens and permanent residents only"
      - "candidates must hold a current permanent visa"
    notes: >
      Read carefully — phrasing varies. "Full working rights" typically means
      no sponsorship. When in doubt, flag rather than auto-discard.

  - id: backend_not_dotnet
    description: Primary backend language/framework is not C# / .NET
    signals:
      - Java, Kotlin, Spring Boot, Spring Framework
      - Python, Django, Flask, FastAPI
      - Node.js, Express, NestJS (as the backend runtime — not frontend JS/TS)
      - Ruby, Ruby on Rails
      - Go / Golang
      - PHP, Laravel, Symfony, "WordPress plugin development"
    notes: >
      Backend must be C#/.NET (ASP.NET Core or .NET Framework). Any other
      primary backend language or framework disqualifies, regardless of
      frontend stack. Only applies to the backend/server language — frontend
      JS/TS frameworks are a separate, flexible dimension (see stack.frontend).
      A secondary/legacy mention alongside a dominant .NET backend may be
      reviewed case by case; it is only a disqualifier when it is primary.

  - id: contract_role
    description: Role is contract, fixed-term, temporary, or casual — not permanent full-time
    signals:
      - "contract role"
      - "fixed-term contract"
      - "12-month contract"
      - "6-month contract"
      - "temporary position"
      - "casual position"
      - "contract-to-hire"
      - "day rate"
    notes: >
      Only permanent full-time roles are in scope. If employment type is
      unstated, assume full-time (the majority case) rather than flagging.
      Only disqualify on explicit contract/temporary/casual language.

  - id: gambling_industry
    description: Company operates in gambling, betting, or related sectors
    signals:
      - gambling
      - sports betting
      - "online casino"
      - wagering
      - iGaming
      - sportsbook

  - id: non_australian
    description: Role is not based in Australia
    notes: >
      Remote roles must be AU-based. "Global remote" that excludes AU, or
      roles requiring relocation outside Australia, are excluded.

  - id: solo_engineer
    description: Candidate would be the only engineer in the company
    signals:
      - "first engineer"
      - "you will be our only developer"
      - "build the engineering function from scratch"
    notes: >
      Small team (2+ engineers) is fine. Being the sole engineer is not.

  - id: sales_required
    description: Role includes cold-calling, direct sales duties, or significant client acquisition
    notes: >
      Customer-facing technical roles (solutions engineering, developer relations)
      are not excluded. This covers roles where selling is part of the job description.

  - id: senior_role
    description: Job title explicitly contains "Senior"
    notes: >
      Hard candidate preference — not a scope assessment. Check if the job title itself
      (as stated in the posting headline, job title line, or h1 heading) contains the
      word "Senior". Common patterns: "Senior Software Engineer", "Senior Developer",
      "Senior Engineer", "Senior Full Stack Developer", "Senior Backend Engineer", etc.
      Do NOT trigger on "Senior" appearing elsewhere in the posting (e.g. "reports to a
      Senior Manager", "works with senior stakeholders"). Only the job title itself triggers this.

# ---------------------------------------------------------------------------
# LOCATION
# ---------------------------------------------------------------------------
location:
  preferred:
    - country: Australia
    notes: Anywhere in Australia is in scope — no city preference, all equally weighted.

  remote:
    accepted: true
    condition: Must be AU-based. Offshore or timezone-incompatible remote is excluded.

  hybrid:
    accepted: true
    notes: Positive signal regardless of city.

  on_site:
    anywhere_in_australia: acceptable

# ---------------------------------------------------------------------------
# VISA SPONSORSHIP
# ---------------------------------------------------------------------------
sponsorship:
  model: binary

  discard:
    description: Any explicit language excluding non-PR/citizen candidates
    examples:
      - "No visa sponsorship offered"
      - "Must be Australian citizen or permanent resident"
      - "Full working rights required"

  in_scope:
    - No mention of work rights or sponsorship (majority of postings — treat as in scope)
    - Explicit positive mention of sponsorship availability (strong positive signal)

  principle: >
    Silence is not a negative signal. Apply to anything not explicitly excluding
    non-PR holders. Do not attempt to infer sponsorship stance from company size,
    industry, or other proxy signals.

# ---------------------------------------------------------------------------
# EXPERIENCE LEVEL
# ---------------------------------------------------------------------------
experience:
  candidate_current: "~4 years"

  ranges:
    ideal:
      max_required: 4 years
    acceptable:
      min_required: 4 years
      max_required: 5 years
    excluded:
      min_required: 5 years

  when_range_stated: >
    When a posting states a range (e.g. "3-6 years"), evaluate the midpoint.
    3-6 years midpoint = 4.5 years = acceptable.
    2-5 years midpoint = 3.5 years = ideal.

  scope_over_title: >
    Title is a weak signal — evaluate the described scope of work.
    Mid-level scope: owns features end-to-end, delivery accountability,
    collaborator on a team, not directing others' technical direction.
    Senior scope: owns roadmap, tech lead responsibilities, architectural
    ownership of large systems, expected to mentor or manage.
    A "Senior Engineer" at a small company describing mid-level scope is in scope.
    A "Mid-level Engineer" at a large enterprise describing junior scope is flagged.

# ---------------------------------------------------------------------------
# SALARY
# ---------------------------------------------------------------------------
salary:
  currency: AUD
  target_base: 120_000

  thresholds:
    flag_below: 100_000
    acceptable_minimum: 100_000
    target_range: [120_000, 140_000]
    flag_above: 160_000

  flag_reasons:
    below_100k: >
      Significant flag. Surface it — do not auto-discard, but note it clearly.
      Only worth pursuing if other factors (company quality, role scope, growth) strongly compensate.
    above_160k: >
      Flag as potential level mismatch. May indicate role is actually senior,
      or company is struggling to hire. Worth understanding before applying.
    missing: >
      Do not flag as orange. Note the absence in salary_assessment as "missing" — that is sufficient.
      Many Australian listings omit salary. Absence is not a signal either way.

# ---------------------------------------------------------------------------
# TECHNICAL STACK
# ---------------------------------------------------------------------------
stack:
  principle: >
    Backend is a hard requirement, not a soft preference — C#/.NET only (see
    hard_disqualifiers.backend_not_dotnet). Frontend is fully flexible and does
    not meaningfully differentiate candidates. Cloud platform is a minor signal.
    Priority order for evaluation: backend, then frontend, then cloud.

  dimension_weights:
    backend: 0.65
    frontend: 0.25
    cloud_and_infra: 0.10

  backend:
    strong_match: [C#, .NET, ASP.NET Core]
    excluded: [Java, Spring Boot, Python, Node.js server-side, Ruby, Go, PHP, Laravel, Symfony]
    notes: >
      No good/acceptable tier — backend stack is binary. Anything other than
      C#/.NET as the primary backend is a hard disqualifier
      (hard_disqualifiers.backend_not_dotnet), not a scored dimension.

  frontend:
    strong_match: [React, Angular, TypeScript, JavaScript]
    good_match: [Vue.js, Next.js]
    acceptable: ["Other modern JS frameworks"]
    notes: >
      Fully flexible — JS, TS, React, and Angular are all fair game and do not
      affect the recommendation tier. Frontend match is secondary to backend.

  cloud:
    strong_match: [Azure]
    good_match: [AWS]
    acceptable: [GCP, "Any other major cloud platform"]
    notes: Slightly flexible — Azure preferred, then AWS, then GCP. Minor signal only.

  ai_tooling:
    weight: low
    notes: >
      Do not weight AI features or tooling mentions heavily in evaluation.
      Most companies use AI tooling. It is not a meaningful differentiator.
      Note if mentioned but do not use as a positive or negative scoring factor.

# ---------------------------------------------------------------------------
# COMPANY
# ---------------------------------------------------------------------------
company:
  context: >
    Candidate has experienced two layoffs due to budgetary reasons.
    Company financial health and trajectory carry real weight in evaluation.

  preferred:
    - Product company with clear product-market fit and paying customers
    - Scale-up with demonstrable growth trajectory
    - Mid-sized company (roughly 50-500 employees)

  acceptable:
    - Startup with PMF, paying customers, not in survival mode
    - Enterprise role on a specific team with clear product scope
    - Pre-PMF startup with credible vision and investors (orange flag, not discard)

  weaker:
    - Agency or consultancy
    - Pre-revenue startup

  stability_signals:
    positive:
      - Specific customer or revenue milestones named
      - Concrete product with identifiable market
      - Team growth trajectory mentioned
      - Named investors or funding round with specific figures
    concerning:
      - Buzzword-heavy description without concrete product or customers
      - Vague "disrupting X" language without substance
      - Heavy equity emphasis without salary transparency
    approach: >
      Financial health is hard to evaluate from a posting alone.
      Apply to roles that pass other criteria, and surface any available
      external data when presenting the opportunity. Evaluate stability
      through the interview process.

  external_enrichment:
    purpose: Surface when presenting opportunities to candidate — not a scoring factor
    sources:
      - glassdoor: Company rating, recent review themes (culture, management, stability)
      - crunchbase: Funding stage, last round date, investor names, headcount
      - news: Recent layoffs, funding announcements, product launches, notable executive exits
    notes: >
      Include enrichment data as context, not as a disqualifier.
      A low Glassdoor score is worth flagging; it does not auto-discard.

  excluded_industries:
    - Gambling and sports betting (hard disqualifier — see above)

  culture_signals:
    positive:
      - Specific engineering practices named (CI/CD, code review, testing standards)
      - Career development and learning investment mentioned
      - Collaborative team language
      - Concrete engineering culture described beyond "we move fast"
    negative:
      - "Fast-paced" as the primary or only culture descriptor
      - "Wear many hats" language (understaffing signal)
      - "Rockstar", "ninja", "guru" language
      - Passion framed as a requirement rather than a nice-to-have
      - Excessive equity emphasis alongside vague salary information

# ---------------------------------------------------------------------------
# ROLE TYPE
# ---------------------------------------------------------------------------
role_type:
  preferred:
    - Product engineering — building and owning features end-to-end
    - Full-stack with meaningful backend ownership
    - Roles with clear delivery accountability

  acceptable:
    - Platform or infrastructure with direct product impact
    - Frontend-specialised if company and scope compensate
    - Consultancy placement if long-term embedded at a single product company

  weaker:
    - Rotating agency project work
    - Primarily maintenance-focused without modernisation scope

  excluded:
    - Pure legacy maintenance with no greenfield or modernisation angle
    - Roles requiring cold-calling or client acquisition

# ---------------------------------------------------------------------------
# TEAM CONDITIONS
# ---------------------------------------------------------------------------
team:
  minimum_engineers: 2

  on_call:
    acceptable: true
    condition: Must include compensation — on-call allowance or TOIL equivalent
    flag_if_missing: >
      If on-call is implied or required but compensation is not mentioned,
      flag this for clarification rather than discarding.

# ---------------------------------------------------------------------------
# ORANGE FLAGS
# Surface in evaluation output alongside recommendation — never silent.
# These are the only things that should appear in orange_flags[].
# Company/culture signals (stability, agency, equity, culture descriptors)
# belong in the rationale as FYI context, not as orange flags.
# ---------------------------------------------------------------------------
orange_flags:
  - Salary below $100k
  - Salary above $160k for a stated mid-level role (potential level mismatch)
  - Required experience 4-5 years (upper boundary of acceptable range)
  - On-call mentioned without explicit compensation

# ---------------------------------------------------------------------------
# FYI CONTEXT (mention in rationale, not as orange flags)
# ---------------------------------------------------------------------------
fyi_context:
  - Company financial health signals (pre-revenue, pre-Series A, buzzword-heavy)
  - Agency or consultancy placement
  - Heavy equity emphasis without salary transparency
  - Culture descriptors that are generic or concerning (rockstar, wear many hats, fast-paced only)
  - Any company/culture signal worth noting but not a blocker

# ---------------------------------------------------------------------------
# EVALUATION OUTPUT STRUCTURE
# ---------------------------------------------------------------------------
evaluation_output:
  required_fields:
    - sponsorship_verdict: "pass | discard — with quoted evidence from posting"
    - location_match: "preferred | acceptable | weak — with city and arrangement (anywhere in Australia is preferred)"
    - experience_match: "ideal | acceptable | excluded — with quoted years requirement"
    - backend_match: "strong | good | acceptable | excluded — with named technologies"
    - frontend_match: "strong | good | acceptable"
    - salary_assessment: "target | acceptable | flagged_low | flagged_high | missing"
    - company_assessment: "preferred | acceptable | weaker | excluded"
    - role_type_match: "preferred | acceptable | weaker | excluded"
    - orange_flags: "list of active flags — empty list if none"
    - external_data: "Glassdoor / Crunchbase / news summary if available — null if not"
    - recommendation: "strong_match | good_match | weak_match | discard"
    - recommendation_rationale: "2-3 sentences on key factors"

  recommendation_thresholds:
    strong_match: Passes all gates, strong or good on backend and experience, no significant orange flags
    good_match: Passes all gates, acceptable on primary dimensions, minor orange flags only
    weak_match: Passes gates but has meaningful orange flags or weak primary dimensions — surface for human review
    discard: Fails any hard disqualifier

  presentation_principle: >
    Never present a numeric score. Present a structured breakdown so the
    candidate can see the trade-offs and make an informed decision.
    Always list orange flags explicitly, even for strong matches.
    Flag ambiguity rather than resolving it with an assumption.
