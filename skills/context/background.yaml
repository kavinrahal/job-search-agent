# PROJECTS
# ---------------------------------------------------------------------------
projects:
  - name: Job Search Agent
    status: active
    description: >
      An always-on, agentic job search management system. Monitors Gmail for
      job-related emails, classifies them with Claude, tracks the full application
      lifecycle, evaluates postings against configurable criteria, and generates
      tailored CVs and cover letters on demand. Agent behaviour is defined through a
      versioned skills system of markdown skill files and YAML context loaded at
      runtime, so evaluation criteria, CV tailoring rules, and cover letter guidelines
      change without touching application code. Features a React dashboard and
      Telegram bot as interfaces to the agent.
    tech_stack:
      backend: [C#, ASP.NET Core, PostgreSQL, Npgsql, EF Core, QuestPDF]
      frontend: [React, TypeScript, Vite, Tailwind CSS]
      ai: [Claude (claude-opus-4-8), Anthropic SDK]
      integrations: [Gmail API, Telegram Bot API]
      auth: [Google OAuth 2.0, hardened cookie sessions]
      deployment: [Railway, Docker]
    highlights:
      - End-to-end product ownership — designed, built, and deployed independently
      - Layered agentic architecture with structured orchestration
      - Built with the same AI-assisted engineering practice used professionally at
        Willow — a skill-authored code-quality and redundancy review over every diff
        before commit, and a multi-agent pipeline to design and implement each
        feature's tests
      - Production-deployed with authentication, security headers, API versioning
    notes: >
      Use this as evidence of initiative, self-direction, and practical AI engineering.
      Strong anchor for roles that value product thinking or agentic/LLM experience —
      and doubles as proof the AI-Assisted Engineering Practice anchor (see Willow) is
      a genuine personal practice, not just a workplace mandate.
      Do not use if the role explicitly discourages personal projects (rare).

