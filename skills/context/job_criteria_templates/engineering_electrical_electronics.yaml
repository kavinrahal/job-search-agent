# STARTER TEMPLATE — engineering_electrical_electronics.yaml
# Seed content for an Electrical/Electronics Engineering candidate's job criteria.
# Placeholder thresholds throughout — adjust before relying on evaluations driven
# by this file. Same shape as context/job_criteria.yaml.
version: "2.0"
profession_category: "Engineering — Electrical/Electronics"

employment_type_preference: [full_time]

hard_disqualifiers:
  - id: sponsorship_excluded
    description: Explicitly excludes candidates requiring visa sponsorship
    signals:
      - "no visa sponsorship"
      - "must be an Australian citizen or permanent resident"
      - "full working rights required"

  - id: non_australian
    description: Role is not based in Australia

  - id: unlicensed_practice
    description: Role requires an electrical license/registration the candidate does not hold
    notes: Only disqualifies if explicitly required as a hard condition, not "working towards".

location:
  preferred:
    - country: Australia
  hybrid:
    accepted: true
  on_site:
    anywhere_in_australia: acceptable

sponsorship:
  model: binary

experience:
  ranges:
    ideal:
      max_required: 5 years
    acceptable:
      min_required: 5 years
      max_required: 8 years
    excluded:
      min_required: 8 years

salary:
  currency: AUD
  target_base: 100_000
  thresholds:
    flag_below: 80_000
    acceptable_minimum: 85_000
    target_range: [100_000, 130_000]
    flag_above: 160_000

skill_dimensions:
  - name: "Discipline specialization"
    priority: 1
    strong_match: ["Power systems", "Control/automation", "Embedded/firmware", "Instrumentation"]
    notes: Match against the candidate's actual specialization.

  - name: "Design/analysis software proficiency"
    strong_match: ["AutoCAD Electrical", "ETAP", "PLC programming (Rockwell/Siemens)", "Altium Designer"]
    priority: 2
    good_match: ["MATLAB/Simulink", "Eplan"]

company:
  preferred:
    - Utility, industrial, or manufacturing company with an in-house engineering function
    - Engineering consultancy with a visible project portfolio
  weaker:
    - Small integrator with no clear scope beyond installation work

role_type:
  preferred:
    - Design/systems engineering with ownership through commissioning
  acceptable:
    - Maintenance/reliability engineering with improvement scope
  weaker:
    - Pure reactive maintenance with no design or improvement scope

team:
  minimum_engineers: 2

orange_flags:
  - Salary below target range
  - Required experience at the upper boundary of acceptable
  - License/registration requirement stated ambiguously

fyi_context:
  - Company's project portfolio and market position

evaluation_output:
  recommendation_thresholds:
    strong_match: Passes all gates, strong on specialization and experience, no significant orange flags
    good_match: Passes all gates, acceptable on primary dimensions, minor orange flags only
    weak_match: Passes gates but has meaningful orange flags or weak primary dimensions
    discard: Fails any hard disqualifier
