# STARTER TEMPLATE — hospitality_chefs.yaml
# Seed content for a chef/kitchen candidate's job criteria. Placeholder
# thresholds throughout — adjust before relying on evaluations driven by this
# file. Same shape as context/job_criteria.yaml.
version: "2.0"
profession_category: "Hospitality — Chefs"

employment_type_preference: [full_time, casual]
# Kitchen roles legitimately span full-time and casual — unlike most other
# templates, casual is included by default here.

hard_disqualifiers:
  - id: sponsorship_excluded
    description: Explicitly excludes candidates requiring visa sponsorship
    signals:
      - "no visa sponsorship"
      - "must be an Australian citizen or permanent resident"
      - "full working rights required"

  - id: non_australian
    description: Role is not based in Australia

  - id: role_below_level
    description: Role is a level clearly below the candidate's stated seniority (e.g. commis for a sous chef candidate)
    notes: Only disqualifies on an explicit title/level mismatch, not ambiguous ones.

location:
  preferred:
    - country: Australia
  remote:
    accepted: false
    notes: Kitchen roles are inherently on-site.
  on_site:
    anywhere_in_australia: acceptable

sponsorship:
  model: binary

experience:
  ranges:
    ideal:
      max_required: 5 years
    acceptable:
      min_required: 5 years
      max_required: 8 years
    excluded:
      min_required: 8 years

salary:
  currency: AUD
  target_base: 65_000
  thresholds:
    flag_below: 55_000
    acceptable_minimum: 55_000
    target_range: [65_000, 80_000]
    flag_above: 100_000
  notes: Hospitality award rates and penalty rates vary widely — treat a stated hourly/annual figure as authoritative over a generic range.

skill_dimensions:
  - name: "Cuisine specialization"
    priority: 1
    strong_match: ["Modern Australian", "Italian", "Asian/pan-Asian", "Fine dining — any cuisine"]
    notes: Match against the candidate's actual specialization and experience.

  - name: "Kitchen role/seniority level"
    priority: 2
    strong_match: ["Sous chef", "Chef de partie", "Head chef"]
    good_match: ["Demi chef de partie"]
    excluded: ["Commis chef", "Kitchen hand"]
    notes: Adjust these tiers to the candidate's actual current level.

company:
  preferred:
    - Established restaurant/venue with a consistent reputation and clear menu identity
  acceptable:
    - New opening backed by an established group or chef
  weaker:
    - Venue with no clear identity or high turnover signals

role_type:
  preferred:
    - À la carte or fine dining service with creative input
  acceptable:
    - High-volume service with clear structure
  weaker:
    - Purely prep-focused role with no service exposure

team:
  minimum_engineers: 2

orange_flags:
  - Salary/rate below target range
  - Split shifts or excessive hours implied without penalty rate mention
  - High staff turnover signals in the posting

fyi_context:
  - Venue reputation (awards, reviews, chef pedigree)
  - Roster pattern and work-life balance signals

evaluation_output:
  recommendation_thresholds:
    strong_match: Passes all gates, strong match on cuisine and level, no significant orange flags
    good_match: Passes all gates, acceptable on primary dimensions, minor orange flags only
    weak_match: Passes gates but has meaningful orange flags or weak primary dimensions
    discard: Fails any hard disqualifier
