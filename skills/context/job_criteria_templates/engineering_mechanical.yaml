# STARTER TEMPLATE — engineering_mechanical.yaml
# Seed content for a Mechanical Engineering candidate's job criteria. Placeholder
# thresholds throughout — adjust to the real candidate's situation before relying
# on evaluations driven by this file. Same shape as context/job_criteria.yaml.
version: "2.0"
profession_category: "Engineering — Mechanical"

employment_type_preference: [full_time]

hard_disqualifiers:
  - id: sponsorship_excluded
    description: Explicitly excludes candidates requiring visa sponsorship
    signals:
      - "no visa sponsorship"
      - "must be an Australian citizen or permanent resident"
      - "full working rights required"
    notes: Silence is not a disqualifier — only explicit exclusion language counts.

  - id: non_australian
    description: Role is not based in Australia

  - id: fifo_incompatible
    description: Fly-in-fly-out or remote-site roster the candidate cannot accommodate
    notes: >
      Only disqualifies if FIFO/DIDO is a stated requirement and the candidate's
      criteria marks FIFO as unacceptable (see location.fifo_acceptable below).

location:
  preferred:
    - country: Australia
  fifo_acceptable: false
  hybrid:
    accepted: true
  on_site:
    anywhere_in_australia: acceptable

sponsorship:
  model: binary

experience:
  ranges:
    ideal:
      max_required: 5 years
    acceptable:
      min_required: 5 years
      max_required: 8 years
    excluded:
      min_required: 8 years

salary:
  currency: AUD
  target_base: 100_000
  thresholds:
    flag_below: 80_000
    acceptable_minimum: 85_000
    target_range: [100_000, 130_000]
    flag_above: 160_000

skill_dimensions:
  - name: "Discipline specialization"
    priority: 1
    strong_match: ["Design/product development", "HVAC", "Manufacturing/process", "Maintenance/reliability"]
    notes: Match against the candidate's actual specialization.

  - name: "Design/analysis software proficiency"
    priority: 2
    strong_match: ["SolidWorks", "AutoCAD", "ANSYS", "Fusion 360"]
    good_match: ["Inventor", "CATIA", "MATLAB"]

company:
  preferred:
    - Manufacturer or OEM with an established product line
    - Engineering consultancy with a visible project portfolio
  weaker:
    - Small workshop with no clear scope beyond general fabrication

role_type:
  preferred:
    - Design/product engineering with ownership through prototyping or production
  acceptable:
    - Maintenance/reliability engineering with improvement scope
  weaker:
    - Pure reactive maintenance with no design or improvement scope

team:
  minimum_engineers: 2

orange_flags:
  - Salary below target range
  - Required experience at the upper boundary of acceptable
  - FIFO/roster requirement not clearly stated

fyi_context:
  - Company's product/project portfolio and market position

evaluation_output:
  recommendation_thresholds:
    strong_match: Passes all gates, strong on specialization and experience, no significant orange flags
    good_match: Passes all gates, acceptable on primary dimensions, minor orange flags only
    weak_match: Passes gates but has meaningful orange flags or weak primary dimensions
    discard: Fails any hard disqualifier
