name: Open PR (App)

# Manually triggered by whoever is driving a coding session (Claude Code or the repo owner)
# once a feature branch is already pushed. Opens the PR under the worksanta-jnr-engineer-bot
# GitHub App, not whichever personal account triggered this run — the point isn't automation,
# it's giving the repo owner an app-authored PR to review/approve instead of one that shows up
# under their own account (see crash-fix.yml's comment on create-github-app-token for why that
# distinction matters: GitHub blocks a PR's own author from approving it).
#
# Deliberately a separate App from crash-fix.yml's: this workflow opens PRs for regular
# feature/fix work, not crash fixes, and authoring those under "worksanta-crash-bot" was
# actively misleading (see PRs #32-#39, all opened this way before this App existed).
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Head branch to open the PR from (already pushed)"
        required: true
        type: string
      title:
        description: "PR title"
        required: true
        type: string
      body:
        description: "PR body"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.JNR_ENGINEER_APP_ID }}
          private-key: ${{ secrets.JNR_ENGINEER_APP_PRIVATE_KEY }}

      - run: echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      # Targets staging, not master: regular feature/fix work goes through the staging
      # environment first (api-staging.worksanta.com / staging.worksanta.com), and only
      # promotes to master (production) once confirmed there. crash-fix.yml deliberately
      # keeps targeting master directly — an urgent, already-CI-verified crash fix shouldn't
      # wait on a staging gate.
      #
      # Passed via env, not interpolated directly into the run: line — same reasoning as the
      # Sentry crash-data handling in crash-fix.yml, just for workflow_dispatch inputs instead
      # of webhook payload data: don't splice caller-controlled text into a shell command.
      - name: Open PR
        env:
          BRANCH: ${{ inputs.branch }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
        run: gh pr create --head "$BRANCH" --base staging --title "$TITLE" --body "$BODY"
