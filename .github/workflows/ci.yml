name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build JobSearchAgent.slnx --configuration Release
      - run: dotnet test JobSearchAgent.slnx --configuration Release --no-build --filter "Category!=contract"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JobSearch.Web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: JobSearch.Web/package-lock.json
      - run: npm ci
      - run: npm run build
